name: Build BigSurface
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Use latest commit of my VoodooGPIO fork
        run: git submodule update --init --remote Dependencies/VoodooGPIO

      - name: Add Tiger Lake UART ID to VoodooSerial
        run: |
          find Dependencies/VoodooSerial -name Info.plist -exec sed -i '' 's/0x34a88086 0x9d278086/0x34a88086 0x9d278086 0xa0a88086/' {} \;
          grep -rn "a0a8" Dependencies/VoodooSerial --include=Info.plist

      - name: Enable UART clock on Tiger Lake (same as Ice Lake)
        run: |
          find Dependencies/VoodooSerial -name VoodooUARTController.cpp -exec sed -i '' 's/if (device.device_id == 0x34a8)/if (device.device_id == 0x34a8 || device.device_id == 0xa0a8)/' {} \;
          grep -rn "0xa0a8" Dependencies/VoodooSerial --include=VoodooUARTController.cpp

      - name: Add debug properties
        run: |
          U=$(find Dependencies/VoodooSerial -name VoodooUARTController.cpp)
          H=$(find BigSurface -name SurfaceSerialHubDriver.cpp)
          perl -0pi -e 's/(void VoodooUARTController::startUARTClock\(\) \{\n)/$1    setProperty("dbg-devid", device.device_id, 16);\n/' "$U"
          perl -0pi -e 's/(\n    if \(bus\.flow_control\) \{\n)/\n    setProperty("dbg-baud", bus.baud_rate, 32);\n    setProperty("dbg-flow", bus.flow_control ? 1ULL : 0ULL, 32);\n    setProperty("dbg-clk", readRegister(LPSS_PRIV + LPSS_UART_CLK), 32);\n    setProperty("dbg-msr", readRegister(DW_UART_MSR), 32);\n    setProperty("dbg-lsr", readRegister(DW_UART_LSR), 32);$1/' "$U"
          perl -0pi -e 's/(LOG\("Warning! Timeout waiting for UART to be ready!"\);)/$1 setProperty("dbg-cts-timeout", true);/' "$U"
          perl -0pi -e 's/(        if \(handler\)\n)/        { static UInt32 dbg_rx = 0; dbg_rx += length; setProperty("dbg-rx-bytes", dbg_rx, 32); }\n$1/' "$U"
          perl -0pi -e 's/(LOG\("Failed to connect to UART controller!"\);)/$1 provider->setProperty("dbg-hub", "connect-failed");/; s/(LOG\("Failed to get SAM version! UART probably misconfigured!"\);)/$1 provider->setProperty("dbg-hub", "sam-timeout");/' "$H"
          grep -n "dbg-" "$U" "$H"

      - name: Fetch Lilu + VirtualSMC SDKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download 1.7.2 -R acidanthera/Lilu -p '*DEBUG.zip' -O Lilu.zip --clobber
          gh release download 1.3.8 -R acidanthera/VirtualSMC -p '*DEBUG.zip' -O VirtualSMC.zip --clobber
          unzip -qo Lilu.zip -d Lilu-dl
          unzip -qo VirtualSMC.zip -d VirtualSMC-dl
          find Lilu-dl VirtualSMC-dl -maxdepth 3 \( -name "Lilu.kext" -o -name "VirtualSMC.kext" \) | while read -r k; do
            cp -R "$k" . ; cp -R "$k" BigSurface/ ; cp -R "$k" Dependencies/
          done
          ls -d *.kext BigSurface/*.kext Dependencies/*.kext

      - name: Build (Debug)
        run: xcodebuild -workspace BigSurface.xcworkspace -scheme BigSurface -configuration Debug -derivedDataPath build CODE_SIGNING_ALLOWED=NO

      - uses: actions/upload-artifact@v4
        with:
          name: BigSurface-Debug
          path: |
            build/Build/Products/Debug/*.kext
            Lilu.kext
