name: Build BigSurface
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Use latest commit of my VoodooGPIO fork
        run: git submodule update --init --remote Dependencies/VoodooGPIO

      - name: Fetch Lilu + VirtualSMC SDKs
        run: |
          curl -sL -o Lilu.zip https://github.com/acidanthera/Lilu/releases/download/1.7.2/Lilu-1.7.2-DEBUG.zip
          curl -sL -o VirtualSMC.zip https://github.com/acidanthera/VirtualSMC/releases/download/1.3.8/VirtualSMC-1.3.8-DEBUG.zip
          unzip -qo Lilu.zip -d Lilu-dl
          unzip -qo VirtualSMC.zip -d VirtualSMC-dl
          find Lilu-dl VirtualSMC-dl -maxdepth 3 \( -name "Lilu.kext" -o -name "VirtualSMC.kext" \) | while read -r k; do
            cp -R "$k" . ; cp -R "$k" BigSurface/ ; cp -R "$k" Dependencies/
          done
          ls -d *.kext BigSurface/*.kext Dependencies/*.kext

      - name: Build
        run: xcodebuild -workspace BigSurface.xcworkspace -scheme BigSurface -configuration Release -derivedDataPath build CODE_SIGNING_ALLOWED=NO

      - uses: actions/upload-artifact@v4
        with:
          name: BigSurface
          path: build/Build/Products/Release/*.kext
